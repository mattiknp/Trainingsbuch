<!DOCTYPE html><script type="application/json" id="cowork-artifact-meta">
{
  "name": "Trainingsbuch",
  "schemaVersion": 1,
  "description": "Tennis- und Konditionstraining planen: Stunden, Einheiten als Checkliste, Notizen und Sprachmemos. Daten lokal, Abgleich über GitHub.",
  "mcpTools": [],
  "mcpServerNames": []
}
</script>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1012">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trainingsbuch">
<title>Trainingsbuch</title>
<link rel="apple-touch-icon" href="icon-trainingsbuch.png">
<link rel="icon" type="image/png" href="icon-trainingsbuch.png">
<style>
:root{
  --bg:#f3f4f5; --surface:#ffffff; --text:#14181c; --text2:#59636d; --line:#e3e6e9; --fill:#eceff1;
  --accent:#17824a; --accent-fg:#ffffff; --danger:#c0332c;
  --court:#356b45; --courtline:#eaf2ec;
  --panel:var(--surface); --panel2:var(--fill); --line2:var(--line); --faint:var(--text2); --dim:var(--text2);
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0d1012; --surface:#171b1f; --text:#eceff1; --text2:#98a2ab; --line:#272d33; --fill:#21272c;
    --accent:#3dbb70; --accent-fg:#04200f; --danger:#ef6a62; color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0d1012; --surface:#171b1f; --text:#eceff1; --text2:#98a2ab; --line:#272d33; --fill:#21272c;
  --accent:#3dbb70; --accent-fg:#04200f; --danger:#ef6a62; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100dvh;padding-bottom:calc(150px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea,select{font:inherit;font-size:17px;color:inherit;background:transparent;border:0;outline:0;border-radius:0;-webkit-appearance:none;appearance:none}
textarea{resize:none;overflow:hidden;display:block}
::placeholder{color:var(--text2);opacity:.75}
.hidden{display:none!important}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}

/* ---- Leiste oben ---- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top-in{max-width:672px;margin:0 auto;height:52px;padding:0 6px;display:flex;align-items:center;justify-content:space-between}
.top-r{display:flex;align-items:center}
.tbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0 10px 0 6px;color:var(--accent);font-size:17px;border-radius:10px}
.tbtn.icon{padding:0;color:var(--text)}
.tbtn span.lbl{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--text2);opacity:.45;display:block}
.sdot[data-s=ok]{background:var(--accent);opacity:1}
.sdot[data-s=busy]{background:#d9a21b;opacity:1;animation:pulse 1s infinite}
.sdot[data-s=err]{background:var(--danger);opacity:1}
.sdot[data-s=idle]{opacity:.8}
@keyframes pulse{50%{opacity:.35}}

/* ---- Seite ---- */
.page{max-width:640px;margin:0 auto;padding:0 16px}
.view-in{animation:vin .22s cubic-bezier(.2,.9,.3,1)}
@keyframes vin{from{opacity:0;transform:translateX(14px)}}
.title{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:6px 0 14px}
.h2{font-size:15px;font-weight:600;color:var(--text2);margin:28px 4px 8px}
.dim{color:var(--text2)}
.hint{color:var(--text2);font-size:15px;margin:0 4px 12px}

/* ---- Gruppen & Zeilen ---- */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;text-align:left;border-top:1px solid var(--line);color:var(--text)}
.group>:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:15px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub.hot{color:var(--accent);font-weight:600}
.row .meta{font-size:15px;color:var(--text2);flex:none}
.row .chev{color:var(--text2);opacity:.55}
.row.accent{color:var(--accent);font-weight:600}
.row.danger{color:var(--danger)}
button.row:active{background:var(--fill)}
@media (hover:hover) and (pointer:fine){button.row:hover{background:var(--fill)}}
.pill{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--text2);white-space:nowrap}
.pill.hot{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:12px;font-weight:600;transition:transform .12s ease-out,opacity .12s}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.line{background:var(--surface);color:var(--text)}
.btn:active{transform:scale(.98)}
.linkbtn{color:var(--accent);font-weight:600;font-size:15px;padding:8px 0}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--text2)}
.icon-btn:active{background:var(--fill)}

/* ---- Eingabefelder im Fluss ---- */
.name-in{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;width:100%;padding:6px 0;margin:0 0 4px}
.focus-in{width:100%;padding:6px 0 14px;font-size:17px}
.slotline{color:var(--accent);font-weight:600;font-size:15px;padding:2px 0 14px;display:block}
.date-title{position:relative;display:flex;align-items:center;gap:6px;font-size:clamp(23px,7vw,30px)}
.date-title .date-hit{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.cr{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.cr-in{width:100%;font-size:17px;font-weight:600}
.cr-actions{display:flex;gap:10px;align-items:center}
.cr-actions .seg{flex:1}
.cr-ok{background:var(--accent);color:var(--accent-fg);font-weight:600;border-radius:10px;padding:0 18px;height:40px}

/* ---- Notizen ---- */
.note{padding:12px 16px 10px;border-top:1px solid var(--line)}
.note-head{display:flex;align-items:center;gap:4px}
.note-title{flex:1;font-weight:600;font-size:15px;padding:4px 0}
.note textarea{width:100%;padding:4px 0 2px;min-height:30px;line-height:1.4}

/* ---- Checkliste ---- */
.checklist{padding:4px 0}
.item{display:flex;align-items:flex-start;padding-right:14px;min-height:46px}
.item .cb{flex:none;width:48px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.cb .box{width:22px;height:22px;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--text2) 75%,transparent);display:flex;align-items:center;justify-content:center;color:var(--accent-fg);transition:background .12s,border-color .12s}
.cb.on .box{background:var(--accent);border-color:var(--accent)}
.cb.ghost{pointer-events:none}
.item textarea.it{flex:1;min-width:0;padding:11px 0 9px;line-height:1.35}
.item.done textarea.it{color:var(--text2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text2) 50%,transparent)}
.item .min{flex:none;font-size:13px;color:var(--text2);padding-top:13px;margin-left:8px}
.subhead{font-size:13px;font-weight:600;color:var(--text2);padding:12px 16px 2px}
.gap{height:10px}
.thumbwrap{padding:0 14px 8px 48px}
.area{width:100%;padding:14px 16px;min-height:96px;line-height:1.45}

/* ---- Memos ---- */
.memo{padding:12px 16px;border-top:1px solid var(--line)}
.group>.memo:first-child{border-top:0}
.memo-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:var(--text2)}
.memo audio{width:100%;height:40px;margin:6px 0 4px}
.memo textarea{width:100%;background:var(--fill);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.45;margin-top:6px}

/* ---- Tastatur-Leiste ---- */
.kbbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:2px}
.kbbar button{width:48px;height:44px;border-radius:10px;color:var(--text);display:flex;align-items:center;justify-content:center}
.kbbar button:active{background:var(--fill)}
.kbbar .sp{width:14px}

/* ---- Sheets ---- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .24s cubic-bezier(.2,.9,.3,1)}
.sheet-panel::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-title,.sheet-panel h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:4px 4px 10px}
.sheet-note,.sheet-panel .sub{color:var(--text2);font-size:15px;margin:-4px 4px 12px}
.flabel{font-size:13px;font-weight:600;color:var(--text2);margin:16px 4px 6px;display:block}
.field{width:100%;background:var(--surface);border-radius:12px;padding:13px 14px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:15px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600;color:var(--text2);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;background:var(--surface);border-radius:12px;margin-top:8px;font-size:16px}
.switchrow input{width:22px;height:22px;accent-color:var(--accent)}
.sheet-grp{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;font-weight:600;background:var(--surface);color:var(--text)}
.sheet-btn.primary{background:var(--accent);color:var(--accent-fg)}
.sheet-btn.danger{color:var(--danger)}
.sheet-btn:active{transform:scale(.98)}
.tips{font-size:15px;line-height:1.55;color:var(--text2);margin-top:14px}
.tips b{color:var(--text)}
.tips ul{margin:6px 0 10px 20px}
.tips code{background:var(--fill);padding:1px 5px;border-radius:5px;font-size:13px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:54px}
.srow:first-child{border-top:0}
.srow .grow{flex:1;min-width:0}
.srow .t{font-weight:600}
.srow .s{font-size:14px;color:var(--text2)}

/* ---- Toast & Aufnahme ---- */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.recbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.recbar .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
.recbar #recTime{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px}
.recbar button{border-radius:999px;padding:9px 15px;font-weight:600;font-size:15px}
#recStop{background:var(--danger);color:#fff}
#recCancel{color:var(--text2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.group.today{background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.today-h{color:var(--accent)}
.trow{padding:0 12px 0 0;gap:8px}
.tmain{flex:1;min-width:0;text-align:left;padding:12px 0 12px 16px;min-height:66px;display:flex;flex-direction:column;justify-content:center}
.tmain .name{font-size:19px}
.tmain .sub{font-size:15px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-btn{background:var(--accent);color:var(--accent-fg);font-weight:600;border-radius:999px;padding:0 16px;height:38px;flex:none}
.pill-btn:active{transform:scale(.96)}
.tn-in{width:100%;padding:14px 16px;min-height:52px;line-height:1.45}
.month-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 14px}
.month-head .title{text-transform:capitalize}
.month-nav{display:flex;flex:none}
.month-nav .icon-btn{color:var(--text)}
.stat{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:4px 4px 0}
.stat-n{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stat-l{font-size:19px;font-weight:600}
.stat-s{flex-basis:100%;color:var(--text2);font-size:15px;margin-top:2px}
/* zielzonen-skizze */
.court{width:100%;aspect-ratio:260/120;height:auto;display:block;border-radius:10px;background:#10301d;touch-action:none}
.court-thumb{width:150px;aspect-ratio:260/120;height:auto;border-radius:8px;margin:6px 0 2px;background:#10301d;display:block;cursor:pointer}
.court-wrap{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}
.court-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.court-tools button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--dim)}
.court-tools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.court-hint{font-size:11px;color:var(--faint);margin-top:7px}
.item .it-court{color:var(--faint);font-size:13px;padding:2px 4px}
.item .it-court.has{color:var(--accent)}


</style>
</head>
<body>
<div id="view"></div>

<div id="kbbar" class="kbbar hidden" role="toolbar" aria-label="Punkt bearbeiten">
  <button data-a="out" aria-label="Ausrücken"></button>
  <button data-a="in" aria-label="Einrücken"></button>
  <span class="sp"></span>
  <button data-a="up" aria-label="Nach oben"></button>
  <button data-a="dn" aria-label="Nach unten"></button>
  <span class="sp"></span>
  <button data-a="court" aria-label="Zielzonen-Skizze"></button>
  <button data-a="del" aria-label="Punkt löschen"></button>
</div>

<div id="sheet" class="sheet hidden"><div class="sheet-bg"></div><div class="sheet-panel" id="sheetPanel"></div></div>

<div id="recBar" class="recbar hidden">
  <span class="dot"></span><span id="recTime">0:00</span>
  <button id="recStop">Stopp</button>
  <button id="recCancel">Verwerfen</button>
</div>

<div id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================
   Trainingsbuch · Stunden → Einheiten → Checkliste
   Daten: localStorage (Struktur) + IndexedDB (Audio)
   ============================================================ */
const KEY = "trainingsbuch:v1";
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = ()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WEEKDAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAYNAMES = ["montag","dienstag","mittwoch","donnerstag","freitag","samstag","sonntag"];
function fmtLong(iso){try{const d=new Date(iso+"T00:00:00");const o={weekday:"long",day:"numeric",month:"long"};if(d.getFullYear()!==new Date().getFullYear())o.year="numeric";return d.toLocaleDateString("de-DE",o);}catch(e){return iso;}}
function fmtMid(iso){try{const d=new Date(iso+"T00:00:00");const o={weekday:"short",day:"numeric",month:"short"};if(d.getFullYear()!==new Date().getFullYear())o.year="2-digit";return d.toLocaleDateString("de-DE",o);}catch(e){return iso;}}
function fmtShort(iso){try{return new Date(iso+"T00:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});}catch(e){return iso;}}
function fmtDur(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2400);}
function autosize(t){t.style.height="auto";t.style.height=t.scrollHeight+"px";}

/* ---------- DOM-Helfer ---------- */
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k==="value") e.value=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const IC={
  back:'<path d="M15 5l-7 7 7 7"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  down:'<path d="M5 9l7 7 7-7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  more:'<g fill="currentColor" stroke="none"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></g>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  trash:'<path d="M4 7h16M9.5 11v5.5M14.5 11v5.5M6 7l1 12.5h10L18 7M9 7V4.5h6V7"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  dn:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  indent:'<path d="M4 6h16M12 11h8M12 16h8M4 9.5L7.5 12 4 14.5"/>',
  outdent:'<path d="M4 6h16M12 11h8M12 16h8M7.5 9.5L4 12l3.5 2.5"/>',
  cal:'<rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
  court:'<rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M12 6v12M3 12h4.5M16.5 12H21"/>'
};
const ico=(n,s=22,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
$$("#kbbar button").forEach(b=>{ b.innerHTML=ico({out:"outdent",in:"indent",up:"up",dn:"dn",court:"court",del:"trash"}[b.dataset.a],22); });

/* ---------- IndexedDB (Audio) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("trainingsbuch",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("audio"))r.result.createObjectStore("audio");};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("audio","readwrite");tx.objectStore("audio").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("audio","readonly").objectStore("audio").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbDel(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("audio","readwrite");tx.objectStore("audio").delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function idbKeys(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("audio","readonly").objectStore("audio").getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
const blobToDataURL = b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});

/* ============================================================
   Zielzonen-Skizze (Tennisplatz quer, Netz bei x=0.5).
   court = { els:[ {t:"zone",x,y} | {t:"arrow",x1,y1,x2,y2} | {t:"note",x,y,s} ] }
   x/y normalisiert 0..1. Renderer + Editor, kompatibel mit
   der Übungssammlung.
   ============================================================ */
const CX = x => 12 + (isFinite(x)?x:0.5)*236;
const CY = y => 10 + (isFinite(y)?y:0.5)*100;
function courtSVG(court, o={}){
  const els = (court && court.els) || [];
  const ah = "ah_"+(o.id||"t");
  const P=[];
  P.push(`<rect x="12" y="10" width="236" height="100" fill="var(--court)" stroke="var(--courtline)" stroke-width="1.6"/>`);
  P.push(`<line x1="130" y1="10" x2="130" y2="110" stroke="var(--courtline)" stroke-width="1.8"/>`);
  P.push(`<line x1="12" y1="22.5" x2="248" y2="22.5" stroke="var(--courtline)" stroke-width="1" opacity=".85"/>`);
  P.push(`<line x1="12" y1="97.5" x2="248" y2="97.5" stroke="var(--courtline)" stroke-width="1" opacity=".85"/>`);
  P.push(`<line x1="65" y1="22.5" x2="65" y2="97.5" stroke="var(--courtline)" stroke-width="1" opacity=".85"/>`);
  P.push(`<line x1="195" y1="22.5" x2="195" y2="97.5" stroke="var(--courtline)" stroke-width="1" opacity=".85"/>`);
  P.push(`<line x1="65" y1="60" x2="195" y2="60" stroke="var(--courtline)" stroke-width="1" opacity=".85"/>`);
  let n=0;
  els.forEach(el=>{
    if(el.t==="zone"){ n++;
      P.push(`<circle cx="${CX(el.x).toFixed(1)}" cy="${CY(el.y).toFixed(1)}" r="9" fill="var(--accent)" fill-opacity=".30" stroke="var(--accent)" stroke-width="1.6"/>`);
      P.push(`<text x="${CX(el.x).toFixed(1)}" y="${(CY(el.y)+3.4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff">${n}</text>`);
    } else if(el.t==="arrow"){
      P.push(`<line x1="${CX(el.x1).toFixed(1)}" y1="${CY(el.y1).toFixed(1)}" x2="${CX(el.x2).toFixed(1)}" y2="${CY(el.y2).toFixed(1)}" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" marker-end="url(#${ah})"/>`);
    } else if(el.t==="note"){
      P.push(`<text x="${CX(el.x).toFixed(1)}" y="${CY(el.y).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0a2a17" stroke-width="3">${esc(el.s)}</text>`);
    }
  });
  return `<svg viewBox="0 0 260 120" class="court" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs><marker id="${ah}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>${P.join("")}</svg>`;
}
function courtField(court, onChange){
  if(!court.els) court.els=[];
  if(!court._id) court._id=uid();
  const wrap=document.createElement("div"); wrap.className="court-wrap";
  let mode="zone", pend=null;
  const HINT={zone:"Aufs Feld tippen = nummerierte Zielzone",arrow:"Startpunkt tippen, dann Zielpunkt = Pfeil (Ballweg)",note:"Tippen und kurzen Text eingeben",erase:"Element antippen zum Entfernen"};
  function paint(){
    wrap.innerHTML = `
      <div class="court-tools">
        ${[["zone","● Zone"],["arrow","↗ Pfeil"],["note","A Text"],["erase","⌫ Löschen"]].map(([m,l])=>`<button data-m="${m}" class="${m===mode?'on':''}">${l}</button>`).join("")}
        <button data-a="undo">↶ zurück</button><button data-a="clear">🗑 leeren</button>
      </div>
      <div class="court-host">${courtSVG(court,{id:court._id})}</div>
      <div class="court-hint">${HINT[mode]}${pend?" · Startpunkt gesetzt":""}</div>`;
    $$('[data-m]',wrap).forEach(b=>b.onclick=()=>{ mode=b.dataset.m; pend=null; paint(); });
    $('[data-a=undo]',wrap).onclick=()=>{ court.els.pop(); pend=null; onChange(); paint(); };
    $('[data-a=clear]',wrap).onclick=()=>{ if(court.els.length && !confirm("Skizze komplett leeren?")) return; court.els=[]; pend=null; onChange(); paint(); };
    const svg=$('svg',wrap);
    svg.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      const r=svg.getBoundingClientRect();
      if(!r.width || !r.height) return;
      let x=((ev.clientX-r.left)/r.width*260 - 12)/236;
      let y=((ev.clientY-r.top)/r.height*120 - 10)/100;
      if(!isFinite(x)||!isFinite(y)) return;
      x=Math.max(0,Math.min(1,x)); y=Math.max(0,Math.min(1,y));
      if(mode==="zone") court.els.push({t:"zone",x,y});
      else if(mode==="note"){ const s=prompt("Kurzer Text:"); if(!s) return; court.els.push({t:"note",x,y,s:s.slice(0,20)}); }
      else if(mode==="arrow"){ if(!pend){ pend={x,y}; } else { court.els.push({t:"arrow",x1:pend.x,y1:pend.y,x2:x,y2:y}); pend=null; } }
      else if(mode==="erase"){
        let bi=-1,bd=0.07;
        court.els.forEach((el,i)=>{ const pts= el.t==="arrow"?[[el.x1,el.y1],[el.x2,el.y2]]:[[el.x,el.y]];
          pts.forEach(([px,py])=>{ const d=Math.hypot(px-x,py-y); if(d<bd){ bd=d; bi=i; } }); });
        if(bi>=0) court.els.splice(bi,1);
      }
      onChange(); paint();
    });
  }
  paint();
  return wrap;
}
function courtSheet(carrier, onSave){
  carrier.court = carrier.court || {els:[]};
  openSheet(`<h2>Zielzonen-Skizze</h2>
    <div class="sub">${esc(carrier.text||"Übung")}</div>
    <div id="csHost"></div>
    <div class="sheet-grp"><button class="sheet-btn" id="csDone" style="justify-content:center;color:var(--accent);border-color:var(--accent)">Fertig</button></div>`);
  $("#csHost",sheetPanel).appendChild(courtField(carrier.court, ()=>{ onSave&&onSave(); }));
  $("#csDone",sheetPanel).onclick=()=>{
    if(!carrier.court.els.length) carrier.court=null;
    onSave&&onSave(); closeSheet();
  };
}



/* ---------- Daten ---------- */
function seedState(){
  return {v:3,settings:{themeMode:"auto",lastArea:"tennis"},
    tomb:{pin:{},session:{},drill:{},memo:{},group:{}},templatesUpdatedAt:0,
    groups:[],pins:[],drills:[],templates:{tennis:[],kondition:[]},sessions:[]};
}
function parseSlot(name){
  const n=" "+String(name||"").toLowerCase()+" ";
  let weekday=null, full=false;
  for(let i=0;i<7;i++){
    if(new RegExp("\\b"+DAYNAMES[i]+"\\b").test(n)){weekday=i;full=true;break;}
  }
  const m=String(name||"").match(/(\d{1,2})[:.](\d{2})/)||String(name||"").match(/(\d{1,2})\s?uhr/i);
  let time=null;
  if(m){const hh=+m[1],mm=m[2]&&m[2].length===2&&/[:.]/.test(m[0])?+m[2]:0;if(hh<24&&mm<60)time=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");}
  if(weekday==null&&time){
    for(let i=0;i<7;i++){ if(new RegExp("\\b"+WEEKDAYS[i].toLowerCase()+"\\.?\\b").test(n)){weekday=i;break;} }
  }
  return {weekday,time};
}
function ensure(s){
  s.settings=Object.assign({themeMode:"auto",lastArea:"tennis"},s.settings||{});
  s.pins||=[]; s.drills||=[]; s.sessions||=[]; s.groups||=[];
  s.templates||={tennis:[],kondition:[]}; s.templatesUpdatedAt||=0;
  s.tomb=Object.assign({pin:{},session:{},drill:{},memo:{},group:{}},s.tomb||{});
  for(const g of ["pin","session","drill","memo","group"]) s.tomb[g]||={};
  s.groups.forEach((g,i)=>{
    g.order=g.order??i; g.roster||=[];
    if(g.weekday!=null&&!g.time){ const pt=parseSlot(g.name).time; if(pt) g.time=pt; }
    if(!g.slotParsed){ g.slotParsed=true; if(g.weekday==null){ const p=parseSlot(g.name); if(p.weekday!=null){g.weekday=p.weekday; if(p.time&&!g.time)g.time=p.time;} } }
  });
  s.sessions.forEach(x=>{
    x.items||=[]; x.memos||=[]; x.tags||=[]; x.attend||={};
    x.items.forEach(i=>{ i.id||=uid(); i.indent=Math.max(0,Math.min(2,i.indent||0)); });
  });
  s.pins.forEach(p=>{ p.groupId=p.groupId||null; });
  return s;
}
let state=load();
function load(){
  try{ const raw=localStorage.getItem(KEY); return raw?ensure(JSON.parse(raw)):seedState(); }
  catch(e){ console.warn(e); return seedState(); }
}
let saveT=null, dirty=false;
function save(){
  dirty=false; clearTimeout(saveT);
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }
  catch(e){ toast("Speicher voll – bitte Backup sichern"); }
  if(!save._silent && typeof queueCloud==="function") queueCloud();
}
function saveSoft(){ dirty=true; clearTimeout(saveT); saveT=setTimeout(save,350); }
function flushSave(){ if(dirty) save(); }
addEventListener("pagehide",flushSave);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) flushSave(); });
const touch=o=>{ o.updatedAt=Date.now(); };

const grp=id=>state.groups.find(g=>g.id===id);
const sess=id=>state.sessions.find(s=>s.id===id);
const sessionsOf=gid=>state.sessions.filter(s=>s.groupId===gid).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
const openCount=s=>s.items.filter(i=>!i.done&&String(i.text||"").trim()).length;
const doneCount=s=>s.items.filter(i=>i.done).length;

function nextOcc(g,fromISO){
  const base=fromISO?new Date(fromISO+"T00:00:00"):new Date();
  const js=(g.weekday+1)%7; const delta=(js-base.getDay()+7)%7;
  const d=new Date(base); d.setHours(0,0,0,0); d.setDate(base.getDate()+delta);
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return {iso:d.toISOString().slice(0,10),delta};
}
function nextPlanDate(g){
  if(g.weekday==null) return todayISO();
  let {iso}=nextOcc(g);
  const have=new Set(sessionsOf(g.id).map(s=>s.date));
  for(let i=0;i<26&&have.has(iso);i++){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+7); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); iso=d.toISOString().slice(0,10); }
  return iso;
}
function slotInfo(g){
  if(g.weekday==null) return null;
  const {delta}=nextOcc(g);
  const day=delta===0?"Heute":delta===1?"Morgen":WEEKDAYS[g.weekday];
  return {text:day+(g.time?" "+g.time:""),hot:delta<=1,delta};
}
function bySlot(a,b){
  const k=g=>g.weekday!=null?(nextOcc(g).delta*1440+(g.time?(+g.time.slice(0,2))*60+(+g.time.slice(3,5)):0)):1e9+(g.order||0);
  return k(a)-k(b)||(a.order||0)-(b.order||0);
}
/* ---------- Navigation ---------- */
const view=$("#view"), sheet=$("#sheet"), sheetPanel=$("#sheetPanel");
let lastPath=null, lastScroll=0, scrollMemo={}, ignoreHash=null;
const path=()=>(location.hash||"#/").slice(1)||"/";
addEventListener("scroll",()=>{lastScroll=scrollY;},{passive:true});
function go(p){
  scrollMemo[lastPath]=lastScroll;
  if(path()!==p){ ignoreHash=p; location.hash="#"+p; }
  render();
}
addEventListener("hashchange",()=>{
  if(ignoreHash&&path()===ignoreHash){ ignoreHash=null; return; }
  ignoreHash=null; flushSave(); scrollMemo[lastPath]=lastScroll; render();
});
function render(){
  kbHandler=null; hideBar(true);
  const p=path(), parts=p.split("/").filter(Boolean);
  let node, canon="/";
  if(parts[0]==="s"&&grp(parts[1])){ node=stundeView(grp(parts[1])); canon=p; }
  else if(parts[0]==="e"&&sess(parts[1])){ node=einheitView(sess(parts[1])); canon=p; }
  else if(parts[0]==="m"&&/^\d{4}-\d{2}$/.test(parts[1]||"")){ node=monatView(parts[1]); canon=p; }
  else node=homeView();
  const same=(lastPath===canon);
  const y=same?scrollY:(scrollMemo[canon]||0);
  if(!same) node.classList.add("view-in");
  view.replaceChildren(node);
  if(canon!==p) history.replaceState(null,"","#"+canon);
  lastPath=canon;
  if(node.__after) node.__after();
  scrollTo(0,y);
}

  const del=h("button",{class:"icon-btn","aria-label":"Notiz löschen",html:ico("trash",19),onclick:()=>{

let creating=false, newArea=null, focusCreator=false, showArchive=false;
function stundeRow(g){
  const ses=sessionsOf(g.id), last=ses[0], open=last?openCount(last):0, sl=slotInfo(g);
  const subs=[], dup=parseSlot(g.name).weekday!=null;   // Name nennt den Termin schon -> nicht wiederholen
  if(sl&&sl.hot) subs.push(h("span",{class:"hot"},dup?sl.text.split(" ")[0]:sl.text));
  else if(sl&&!dup) subs.push(h("span",{},sl.text));
  if(g.area==="kondition") subs.push(h("span",{},(subs.length?" · ":"")+"Kondition"));
  if(!subs.length||(dup&&!(sl&&sl.hot)&&g.area!=="kondition")) subs.push(h("span",{},(subs.length?" · ":"")+(last?"zuletzt "+fmtMid(last.date):"Noch keine Einheit")));
  const b=h("button",{class:"row"},
    h("span",{class:"grow"},h("div",{class:"name"},g.name),h("div",{class:"sub"+(sl&&sl.hot?" hot":"")},...subs)),
    h("span",{class:"ico chev",html:ico("chev",20)}));
  b.addEventListener("click",()=>go("/s/"+g.id));
  return b;
}
function creatorRow(first){
  let area=newArea||state.settings.lastArea||"tennis";
  const inp=h("input",{class:"cr-in",placeholder:"z. B. Di 17:30 Herren",autocomplete:"off",autocapitalize:"words",enterkeyhint:"done","aria-label":"Name der Stunde"});
  const bT=h("button",{class:area==="tennis"?"on":""},"Tennis"), bK=h("button",{class:area==="kondition"?"on":""},"Kondition");
  const setA=a=>{area=a;newArea=a;bT.classList.toggle("on",a==="tennis");bK.classList.toggle("on",a==="kondition");};
  bT.addEventListener("click",()=>setA("tennis")); bK.addEventListener("click",()=>setA("kondition"));
  const create=()=>{ const name=inp.value.trim(); if(!name){inp.focus();return;} createStunde(name,area); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.isComposing){e.preventDefault();create();} });
  const ok=h("button",{class:"cr-ok",onclick:create},"Anlegen");
  const row=h("div",{class:"cr"},inp,h("div",{class:"cr-actions"},h("div",{class:"seg"},bT,bK),ok));
  row.__focus=()=>inp.focus();
  return row;
}
function createStunde(name,area){
  const slot=parseSlot(name), now=Date.now();
  const g={id:uid(),name,area,order:Math.max(-1,...state.groups.map(x=>x.order??0))+1,updatedAt:now,roster:[],slotParsed:true};
  if(slot.weekday!=null){ g.weekday=slot.weekday; if(slot.time) g.time=slot.time; }
  state.groups.push(g);
  state.pins.push({id:"tn-"+g.id,area,groupId:g.id,title:"Teilnehmer",body:"",updatedAt:now},{id:uid(),area,groupId:g.id,title:"Ideen",body:"",updatedAt:now});
  state.settings.lastArea=area; creating=false; newArea=null;
  save(); go("/s/"+g.id);
}
function todayRow(g,iso){
  const s=sessionsOf(g.id).find(x=>x.date===iso);
  const tot=s?s.items.filter(i=>String(i.text||"").trim()).length:0;
  const info=[g.time?g.time+" Uhr":null,g.area==="kondition"?"Kondition":null,s?(tot?tot+" Punkte geplant":"Einheit angelegt"):"Noch keine Einheit"].filter(Boolean).join(" · ");
  return h("div",{class:"row trow"},
    h("button",{class:"tmain",onclick:()=>go("/s/"+g.id)},h("div",{class:"name"},g.name),h("div",{class:"sub"},info)),
    h("button",{class:"pill-btn",onclick:()=>s?go("/e/"+s.id):createEinheit(g)},s?"Öffnen":"Planen"));
}
function homeView(){
  const root=h("div");
  root.append(topbar({right:[syncBtn(),moreBtn(homeMenu)]}));
  const page=h("main",{class:"page"}); root.append(page);
  page.append(h("h1",{class:"title"},"Stunden"));

  addTa.addEventListener("focus",()=>{ activeIt=null; showBar(); reveal(addTa); });
  addTa.addEventListener("blur",()=>{ commitAdd(); hideBar(); });
  addTa.addEventListener("keydown",e=>{
    if(e.isComposing||e.keyCode===229) return;
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); commitAdd(); return; }
    if(e.key==="Tab"){ e.preventDefault(); addIndent=clampI(addIndent+(e.shiftKey?-1:1)); applyAddIndent(); return; }
    if(e.key==="Backspace"&&!addTa.value&&addTa.selectionStart===0){
      if(addIndent>0){ e.preventDefault(); addIndent--; applyAddIndent(); return; }
      const l=s.items[s.items.length-1]; if(l){ e.preventDefault(); focusItem(l.id,"end"); }
      return;
    }
    if(e.key==="ArrowUp"&&addTa.selectionStart===0){ const l=s.items[s.items.length-1]; if(l){ e.preventDefault(); focusItem(l.id,"end"); } }
  });
  addTa.addEventListener("paste",e=>{
    const t=(e.clipboardData||window.clipboardData).getData("text");
    if(!t||!/\n/.test(t.trim())) return;
    e.preventDefault(); addTa.value=t; commitAdd();
  });
  kbHandler=(a)=>{
    if(a==="in"||a==="out"){
      const d=a==="in"?1:-1;
      if(activeIt) setIndent(activeIt,(activeIt.indent||0)+d); else { addIndent=clampI(addIndent+d); applyAddIndent(); }
      return;
    }
    if(!activeIt) return;
    if(a==="up"||a==="dn") moveItem(activeIt,a==="up"?-1:1);
    else if(a==="court") openCourt(activeIt);
    else if(a==="del"){ const i=s.items.indexOf(activeIt), prev=s.items[i-1]; const it=activeIt; activeIt=null; removeItem(it,prev?{id:prev.id,pos:"end"}:"add"); }
  };
  paint();

  /* ---- Nachbesprechung ---- */
  if((s.note||"").trim()){
    page.append(h("div",{class:"h2"},"Notiz"));
    const ng=h("div",{class:"group"}); const nt=h("textarea",{class:"area",placeholder:"Notiz …"}); nt.value=s.note;
    nt.addEventListener("input",()=>{s.note=nt.value;autosize(nt);touch(s);saveSoft();}); ng.append(nt); page.append(ng);
  }
  if((s.reflection||"").trim()){
    page.append(h("div",{class:"h2"},"Nachbesprechung"));
    const rg=h("div",{class:"group"}); const rt=h("textarea",{class:"area",placeholder:"Nachbesprechung"}); rt.value=s.reflection;
    rt.addEventListener("input",()=>{s.reflection=rt.value;autosize(rt);touch(s);saveSoft();}); rg.append(rt); page.append(rg);
  }

  /* ---- Sprachmemos ---- */
  page.append(h("div",{class:"h2"},"Sprachmemos"));
  if(s.memos.length){
    const mg=h("div",{class:"group",style:"margin-bottom:10px"}); page.append(mg);
    s.memos.forEach(m=>mg.append(memoEl(s,m)));
  }
  page.append(h("button",{class:"btn line",onclick:()=>startRec(s.id)},h("span",{class:"ico",html:ico("mic",20)}),"Sprachmemo aufnehmen"));

  root.__after=()=>{
    $$("textarea",root).forEach(autosize);
    if(pendingAddFocus){ pendingAddFocus=false; addTa.focus(); }
  };
  return root;
}
function memoEl(s,m){
  const el=h("div",{class:"memo"});
  const head=h("div",{class:"memo-head"},
    h("span",{},new Date(m.createdAt).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})+" · "+(m.durMs?fmtDur(m.durMs):"–")),
    h("button",{class:"icon-btn","aria-label":"Memo löschen",html:ico("trash",19),onclick:async()=>{
      if(!confirm("Memo löschen?")) return;
      try{await idbDel(m.id);}catch(e){}
      state.tomb.memo[m.id]=Date.now(); s.memos=s.memos.filter(x=>x.id!==m.id); touch(s); save(); render();
    }}));
  const au=h("audio",{controls:true,preload:"none"});
  el.append(head,au);
  idbGet(m.id).then(blob=>{
    if(blob) au.src=URL.createObjectURL(blob);
    else au.replaceWith(h("div",{class:"hint",style:"margin:8px 0"},"Aufnahme ist noch nicht auf diesem Gerät – Cloud-Sync starten."));
  }).catch(()=>{});
  const holder=h("div"); el.append(holder);
  const paintT=()=>{
    holder.replaceChildren();
    if((m.transcript||"").trim()){
      const ta=h("textarea",{rows:"1","aria-label":"Transkript"}); ta.value=m.transcript;
      ta.addEventListener("input",()=>{m.transcript=ta.value;m.mTransAt=Date.now();autosize(ta);touch(s);saveSoft();});
      holder.append(ta); setTimeout(()=>autosize(ta),0);
    }
    const btn=h("button",{class:"linkbtn"},(m.transcript||"").trim()?"Neu transkribieren":"Transkribieren");
    btn.addEventListener("click",async()=>{
      btn.disabled=true; btn.textContent="Wird transkribiert …";
      try{
        const txt=await transcribeMemo(m);
        m.transcript=txt; m.mTransAt=Date.now(); touch(s); save(); paintT();
      }catch(e){ toast("Transkription: "+(e.message||e)); btn.disabled=false; btn.textContent="Nochmal versuchen"; }
    });
    holder.append(btn);
  };
  paintT();
  return el;
}

let LIB = null;
try{ const c=JSON.parse(localStorage.getItem("tb_lib_cache")||"null"); if(c&&c.data) LIB=c; }catch(e){}
async function libLoad(force){
  if(!force && LIB && Date.now()-LIB.at < 6e5) return LIB.data;
  try{
    const f = await ghGetAt(CFG.libUser(), CFG.libRepo(), CFG.libBranch(), CFG.libFile());
    if(!f || (!f.content && !f.download_url)) throw new Error("Sammlung nicht gefunden");
    let txt;
    if(f.content) txt = b64dec(f.content);
    else txt = await fetch(f.download_url).then(r=>r.text());
    const parsed = JSON.parse(txt);
    const data = parsed.state || parsed;
    data.exercises ||= []; data.blueprints ||= [];
    LIB = {at:Date.now(), data};
    try{ localStorage.setItem("tb_lib_cache", JSON.stringify(LIB)); }catch(e){}
    return data;
  }catch(e){
    if(LIB && LIB.data) return LIB.data;   // Fallback: alter Cache
    throw e;
  }
}

const STT = {
  prov: ()=>localStorage.getItem("tb_stt_prov")||"groq",
  key:  ()=>localStorage.getItem("tb_stt_key")||"",
  auto: ()=>localStorage.getItem("tb_stt_auto")==="1",
};
async function transcribeMemo(m){
  if(!STT.key()) { sttSheet(); throw new Error("Erst API-Key hinterlegen"); }
  const blob = await idbGet(m.id);
  if(!blob) throw new Error("Aufnahme nicht auf diesem Gerät");
  const groq = STT.prov()==="groq";
  const url = groq ? "https://api.groq.com/openai/v1/audio/transcriptions"
                   : "https://api.openai.com/v1/audio/transcriptions";
  const model = groq ? "whisper-large-v3-turbo" : "whisper-1";
  const ext = /(mp4|aac|m4a)/.test(m.mime||"") ? "m4a" : "webm";
  const fd = new FormData();
  fd.append("file", new File([blob], "memo."+ext, {type: blob.type||"audio/webm"}));
  fd.append("model", model);
  fd.append("language", "de");
  fd.append("response_format", "json");
  const r = await fetch(url, { method:"POST", headers:{ Authorization:"Bearer "+STT.key() }, body: fd });
  if(!r.ok){
    let msg = "HTTP "+r.status;
    try{ const j=await r.json(); msg = j.error?.message || msg; }catch(e){}
    throw new Error(msg);
  }
  const j = await r.json();
  const txt = (j.text||"").trim();
  if(!txt) throw new Error("leeres Ergebnis");
  return txt;
}

/* ---------- Aufnahme ---------- */
let rec={mr:null,chunks:[],stream:null,t0:0,timer:null,targetId:null,cancelled:false};
async function startRec(sid){
  if(rec.mr&&rec.mr.state==="recording") return;
  try{ rec.stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast("Kein Mikrofonzugriff möglich"); return; }
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
  rec.mr=mime?new MediaRecorder(rec.stream,{mimeType:mime}):new MediaRecorder(rec.stream);
  rec.chunks=[]; rec.cancelled=false; rec.targetId=sid; rec.t0=Date.now();
  rec.mr.ondataavailable=e=>{ if(e.data.size) rec.chunks.push(e.data); };
  rec.mr.onstop=async()=>{
    rec.stream.getTracks().forEach(t=>t.stop());
    $("#recBar").classList.add("hidden"); clearInterval(rec.timer);
    if(rec.cancelled) return;
    const blob=new Blob(rec.chunks,{type:rec.mr.mimeType||mime||"audio/webm"});
    const id=uid();
    try{ await idbPut(id,blob); }catch(e){ toast("Audio konnte nicht gespeichert werden"); return; }
    const s=sess(rec.targetId); if(!s) return;
    const memo={id,label:"",createdAt:Date.now(),mime:blob.type,durMs:Date.now()-rec.t0};
    s.memos.push(memo); touch(s); save(); render(); toast("Memo gespeichert");
    if(STT.auto()&&STT.key()){
      transcribeMemo(memo).then(txt=>{ memo.transcript=txt; memo.mTransAt=Date.now(); touch(s); save(); if(!isEditing()) render(); toast("Transkript fertig"); })
        .catch(e=>toast("Transkription: "+(e.message||e)));
    }
  };
  rec.mr.start();
  $("#recBar").classList.remove("hidden"); $("#recTime").textContent="0:00";
  rec.timer=setInterval(()=>{ $("#recTime").textContent=fmtDur(Date.now()-rec.t0); },500);
}
$("#recStop").addEventListener("click",()=>{ if(rec.mr&&rec.mr.state==="recording"){ rec.cancelled=false; rec.mr.stop(); } });
$("#recCancel").addEventListener("click",()=>{ if(rec.mr&&rec.mr.state==="recording"){ rec.cancelled=true; rec.mr.stop(); toast("Aufnahme verworfen"); } });

/* ---------- Backup ---------- */
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},500);
  toast("Datei „"+name+"“ erstellt");
}
async function exportJSON(){
  toast("Backup wird erstellt …");
  const audio={};
  try{ for(const k of await idbKeys()){ const b=await idbGet(k); if(b) audio[k]=await blobToDataURL(b); } }catch(e){ console.warn(e); }
  downloadBlob(new Blob([JSON.stringify({app:"trainingsbuch",exportedAt:new Date().toISOString(),state,audio})],{type:"application/json"}),"trainingsbuch-"+todayISO()+".json");
  closeSheet();
}
function importJSON(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const data=JSON.parse(await f.text()); const inc=data.state||data;
      if(!inc.sessions&&!inc.groups) throw new Error("Format");
      if(!confirm("Backup laden? Der aktuelle Stand auf diesem Gerät wird ersetzt.")) return;
      if(data.audio){ for(const [k,d] of Object.entries(data.audio)){ try{ await idbPut(k,await dataURLToBlob(d)); }catch(e){} } }
      state=ensure(inc); save(); closeSheet(); go("/"); toast("Backup geladen");
    }catch(e){ alert("Datei konnte nicht gelesen werden."); }
  };
  inp.click();
}

/* ============================================================
   Cloud-Sync über GitHub  (Handy <-> Mac)
   Ein JSON im Repo ist die gemeinsame Wahrheit. Beim Abgleich
   wird pro Eintrag (Pin / Einheit / Übung / Stunde) der neuere
   Stand behalten – nichts wird komplett überschrieben.
   Gelöschtes bleibt 90 Tage als Tombstone vermerkt, damit es
   nicht vom anderen Gerät „wiederaufersteht“.
   Sprachmemos wandern als einzelne Dateien unter audio/<id> mit.
   ============================================================ */
const CFG = {
  on:    ()=>localStorage.getItem("tb_cloud_on")==="1",
  tok:   ()=>localStorage.getItem("tb_gh_tok")||"",
  user:  ()=>localStorage.getItem("tb_gh_user")||"mattiknp",
  repo:  ()=>localStorage.getItem("tb_gh_repo")||"routine-tracker",
  branch:()=>localStorage.getItem("tb_gh_branch")||"main",
  file:  ()=>localStorage.getItem("tb_gh_file")||"trainingsbuch.json",
  audio: ()=>localStorage.getItem("tb_cloud_audio")!=="0",
  auto:  ()=>localStorage.getItem("tb_cloud_auto")!=="0",
  // Übungssammlung (nur lesend) – standardmäßig dasselbe Repo, umstellbar
  libUser:  ()=>localStorage.getItem("tb_lib_user")||localStorage.getItem("tb_gh_user")||"mattiknp",
  libRepo:  ()=>localStorage.getItem("tb_lib_repo")||localStorage.getItem("tb_gh_repo")||"routine-tracker",
  libBranch:()=>localStorage.getItem("tb_lib_branch")||localStorage.getItem("tb_gh_branch")||"main",
  libFile:  ()=>localStorage.getItem("tb_lib_file")||"uebungssammlung.json",
};
function cfgSet(k,v){ localStorage.setItem(k,v); }

const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(String(s).replace(/\s/g,""))));
function ghHead(){ return {Authorization:"token "+CFG.tok(), Accept:"application/vnd.github+json"}; }
function ghUrl(path){ return "https://api.github.com/repos/"+CFG.user()+"/"+CFG.repo()+"/contents/"+path.split("/").map(encodeURIComponent).join("/"); }
async function ghGetAt(user,repo,branch,path){
  const url = "https://api.github.com/repos/"+user+"/"+repo+"/contents/"+path.split("/").map(encodeURIComponent).join("/")
    +"?ref="+encodeURIComponent(branch)+"&t="+Date.now();
  const headers = { Accept:"application/vnd.github+json" };
  if(CFG.tok()) headers.Authorization = "token "+CFG.tok();
  const r = await fetch(url, {headers, cache:"no-store"});
  if(r.status===404) return null;
  if(r.status===401||r.status===403) throw new Error("Token abgelehnt ("+r.status+")");
  if(!r.ok) throw new Error("GitHub "+r.status);
  return r.json();
}
async function ghGet(path){ return ghGetAt(CFG.user(), CFG.repo(), CFG.branch(), path); }
async function ghPut(path,b64,sha,msg){
  const body={message:msg||("trainingsbuch "+new Date().toISOString()), content:b64, branch:CFG.branch()};
  if(sha) body.sha=sha;
  const r=await fetch(ghUrl(path),{method:"PUT",headers:{...ghHead(),"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===409){ const e=new Error("conflict"); e.conflict=true; throw e; }
  if(!r.ok) throw new Error("GitHub "+r.status+" (schreiben)");
  return r.json();
}
async function ghDel(path,sha,msg){
  const r=await fetch(ghUrl(path),{method:"DELETE",headers:{...ghHead(),"Content-Type":"application/json"},
    body:JSON.stringify({message:msg||("del "+path),sha,branch:CFG.branch()})});
  return r.ok;
}

/* ---- Merge ---- */
const TOMB_TTL = 3*864e5;   // Löschungen wirken nur 3 Tage – danach werden sie ignoriert (verhindert „Geister-Löschungen“ zwischen Geräten)
function tombActive(ts){ return ts && ts > Date.now()-TOMB_TTL; }
function pruneTomb(t){
  const cut=Date.now()-TOMB_TTL;
  for(const g of Object.values(t)) for(const id of Object.keys(g)) if(g[id]<cut) delete g[id];
  return t;
}
function mergeTomb(a={},b={}){
  const out={pin:{},session:{},drill:{},memo:{},group:{}};
  for(const g of Object.keys(out)){
    const m={...(a[g]||{})};
    for(const [id,ts] of Object.entries(b[g]||{})) m[id]=Math.max(ts,m[id]||0);
    out[g]=m;
  }
  return out;
}
function mergeList(a=[],b=[],tomb={}){
  const m=new Map();
  for(const x of [...a,...b]){ const p=m.get(x.id); if(!p || (x.updatedAt||0) > (p.updatedAt||0)) m.set(x.id,x); }
  for(const [id,ts] of Object.entries(tomb)){ const e=m.get(id); if(e && tombActive(ts) && (e.updatedAt||0) < ts) m.delete(id); }
  return [...m.values()];
}
function mergeSessions(a=[],b=[],tomb){
  const m=new Map();
  for(const x of [...a,...b]){
    const p=m.get(x.id);
    if(!p){ m.set(x.id,{...x,memos:[...(x.memos||[])]}); continue; }
    const newer=(x.updatedAt||0) > (p.updatedAt||0) ? x : p;
    const mem=new Map();
    for(const mm of [...(p.memos||[]),...(x.memos||[])]){
      const q=mem.get(mm.id);
      if(!q || (mm.synced&&!q.synced) || (mm.mLabelAt||0)>(q.mLabelAt||0) || (mm.mTransAt||0)>(q.mTransAt||0)) mem.set(mm.id,mm);
    }
    m.set(x.id,{...newer, memos:[...mem.values()].filter(mm=>!(tomb.memo && tombActive(tomb.memo[mm.id])))});
  }
  for(const [id,ts] of Object.entries(tomb.session||{})){ const e=m.get(id); if(e && tombActive(ts) && (e.updatedAt||0) < ts) m.delete(id); }
  return [...m.values()];
}
function mergeState(local, remote){
  const tomb = pruneTomb(mergeTomb(local.tomb, remote.tomb));
  const tplRemoteNewer = (remote.templatesUpdatedAt||0) > (local.templatesUpdatedAt||0);
  return ensure({
    v:2,
    settings: local.settings,
    groups:   mergeList(local.groups, remote.groups, tomb.group),
    pins:     mergeList(local.pins, remote.pins, tomb.pin),
    drills:   mergeList(local.drills, remote.drills, tomb.drill),
    sessions: mergeSessions(local.sessions, remote.sessions, tomb),
    templates: tplRemoteNewer ? remote.templates : local.templates,
    templatesUpdatedAt: Math.max(local.templatesUpdatedAt||0, remote.templatesUpdatedAt||0),
    tomb
  });
}
function stripForCloud(s){ const {settings, ...rest}=s; return rest; }

/* ---- Konflikt-/Abgleich-Log ---- */
function snapIds(st){
  const m=new Map();
  ["pins","drills","groups","sessions"].forEach(k=>(st[k]||[]).forEach(x=>m.set(k+":"+x.id, x.updatedAt||0)));
  return m;
}
function diffSnap(before, after){
  let neu=0, upd=0, del=0;
  for(const [k,ts] of after){ if(!before.has(k)) neu++; else if(ts > before.get(k)) upd++; }
  for(const k of before.keys()) if(!after.has(k)) del++;
  return {neu, upd, del};
}
function pushSyncLog(entry){
  let log=[]; try{ log=JSON.parse(localStorage.getItem("tb_sync_log")||"[]"); }catch(e){}
  log.unshift(entry); log=log.slice(0,20);
  localStorage.setItem("tb_sync_log", JSON.stringify(log));
}

/* ---- Ablauf ---- */
let syncing=false, syncT=null, remoteSha=null, resyncPending=false, editingUntil=0;
function setDot(s,txt){ dotState={s,t:txt||""}; const el=$("#syncDot"); if(el){ el.dataset.s=s; el.title=txt||""; } }
function markEditing(){ editingUntil = Date.now() + 15000; }
function isEditing(){
  if(Date.now() < editingUntil) return true;
  if(sheet && !sheet.classList.contains("hidden")) return true;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  return false;
}
function queueCloud(){
  try{ if(!CFG.on()||!CFG.auto()) return; }catch(e){ return; }
  if(syncing){ resyncPending=true; return; }
  clearTimeout(syncT); syncT=setTimeout(()=>syncNow(false), 4000);
}
async function syncNow(manual){
  if(!CFG.on()){ if(manual) toast("Cloud-Sync ist aus"); return; }
  if(!CFG.tok()){ if(manual) toast("Kein Token hinterlegt"); return; }
  if(syncing){ resyncPending=true; return; }
  // Nie eingreifen, während der Nutzer tippt oder ein Fenster offen ist – nur verschieben, nichts verwerfen
  if(!manual && isEditing()){ clearTimeout(syncT); syncT=setTimeout(()=>syncNow(false), 5000); return; }
  syncing=true; setDot("busy","Gleicht ab …");
  let structuralChange=false;
  try{
    let remoteObj=null;
    const rf=await ghGet(CFG.file());
    if(rf && rf.content){
      try{ remoteObj=ensure(JSON.parse(b64dec(rf.content))); remoteSha=rf.sha; }catch(e){ remoteObj=null; }
    } else if(rf){ remoteSha=rf.sha; }

    if(remoteObj && isEditing()){        // während der Fetch lief, hat der Nutzer angefangen zu tippen -> Merge verschieben
      resyncPending=true;
    } else if(remoteObj){
      const before=snapIds(state);
      state = mergeState(state, remoteObj);
      const d=diffSnap(before, snapIds(state));
      if(d.neu||d.upd||d.del){
        structuralChange=true;
        pushSyncLog({at:Date.now(), ...d});
        const parts=[]; if(d.neu)parts.push(d.neu+" neu"); if(d.upd)parts.push(d.upd+" geändert"); if(d.del)parts.push(d.del+" entfernt");
        toast("Vom anderen Gerät: "+parts.join(", "));
      }
    }
    save._silent=true; save(); save._silent=false;

    if(CFG.audio()){ try{ await syncAudio(state); }catch(e){ console.warn("audio-sync",e); } }
    save._silent=true; save(); save._silent=false;

    const outStr = JSON.stringify(stripForCloud(state));
    const remoteStr = remoteObj ? JSON.stringify(stripForCloud(remoteObj)) : null;
    if(outStr !== remoteStr){
      try{
        const res=await ghPut(CFG.file(), b64enc(outStr), remoteSha, "trainingsbuch "+new Date().toISOString());
        remoteSha=res.content.sha;
      }catch(e){
        if(e.conflict){
          const rf2=await ghGet(CFG.file());
          const remote2=rf2&&rf2.content?ensure(JSON.parse(b64dec(rf2.content))):null;
          if(remote2 && !isEditing()){ state=mergeState(state,remote2); structuralChange=true; save._silent=true;save();save._silent=false; }
          const res2=await ghPut(CFG.file(), b64enc(JSON.stringify(stripForCloud(state))), rf2&&rf2.sha, "trainingsbuch merge "+new Date().toISOString());
          remoteSha=res2.content.sha;
        } else throw e;
      }
    }
    localStorage.setItem("tb_cloud_last", Date.now()+"");
    setDot("ok","Synchron · "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));
    if(structuralChange && !isEditing()) render();     // nur neu zeichnen, wenn sich wirklich was geändert hat und niemand gerade tippt
    if(manual) toast("Abgeglichen");
  }catch(e){
    console.warn(e); setDot("err", e.message||"Fehler");
    if(manual) toast("Sync-Fehler: "+(e.message||e));
  }finally{
    syncing=false;
    if(resyncPending){ resyncPending=false; clearTimeout(syncT); syncT=setTimeout(()=>syncNow(false), 2500); }
  }
}
async function syncAudio(st){
  let localKeys;
  try{ localKeys=new Set(await idbKeys()); }catch(e){ return; }
  const memos = st.sessions.flatMap(s=>s.memos||[]);
  for(const m of memos){                                   // hochladen
    if(m.synced || !localKeys.has(m.id)) continue;
    try{
      const blob=await idbGet(m.id); if(!blob) continue;
      const ext=/(mp4|aac|m4a)/.test(m.mime||"")?"m4a":"webm";
      const b64=(await blobToDataURL(blob)).split(",")[1];
      const ex=await ghGet("audio/"+m.id+"."+ext).catch(()=>null);
      await ghPut("audio/"+m.id+"."+ext, b64, ex&&ex.sha, "memo "+m.id);
      m.synced=true; m.ext=ext;
    }catch(e){ /* nächster Sync */ }
  }
  for(const m of memos){                                   // herunterladen
    if(localKeys.has(m.id)) continue;
    const ext=m.ext||"webm";
    try{
      const f=await ghGet("audio/"+m.id+"."+ext);
      if(f && f.download_url){ await idbPut(m.id, await fetch(f.download_url).then(r=>r.blob())); }
      else if(f && f.content){ await idbPut(m.id, await dataURLToBlob("data:"+(m.mime||"audio/webm")+";base64,"+f.content.replace(/\s/g,""))); }
    }catch(e){}
  }
  for(const id of Object.keys(st.tomb.memo||{})){          // löschen
    for(const ext of ["webm","m4a"]){
      try{ const f=await ghGet("audio/"+id+"."+ext); if(f) await ghDel("audio/"+id+"."+ext, f.sha, "memo del "+id); }catch(e){}
    }
  }
}
function cloudInit(){
  setDot(CFG.on()?"idle":"off", CFG.on()?"Cloud-Sync bereit":"Cloud-Sync aus");
  document.addEventListener("input", markEditing, true);
  document.addEventListener("keydown", markEditing, true);
  document.addEventListener("focusin", e=>{ if(e.target && e.target.matches && e.target.matches("input,textarea,select")) markEditing(); }, true);
  if(CFG.on()) setTimeout(()=>syncNow(false), 1500);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && CFG.on() && CFG.auto() && !isEditing()) setTimeout(()=>syncNow(false), 800); });
  window.addEventListener("online",()=>{ if(CFG.on() && !isEditing()) syncNow(false); });
}



/* ---------- Start ---------- */
applyTheme();
render();
cloudInit();
</script>
