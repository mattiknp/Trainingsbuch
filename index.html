function syncLogHtml(){
  let log=[]; try{ log=JSON.parse(localStorage.getItem("tb_sync_log")||"[]"); }catch(e){}
  if(!log.length) return "";
  const rows = log.slice(0,8).map(e=>{
    const t=new Date(e.at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    const p=[]; if(e.neu)p.push(e.neu+" neu"); if(e.upd)p.push(e.upd+" geändert"); if(e.del)p.push(e.del+" entfernt");
    return `<div style="display:flex;justify-content:space-between;gap:10px"><span>${t}</span><span style="color:var(--dim)">${p.join(" · ")}</span></div>`;
  }).join("");
  return `<div class="blk-label" style="margin-top:12px">Zuletzt zusammengeführt</div><div class="cf-status" style="line-height:1.9">${rows}</div>`;
}

/* ============================================================
   Übungssammlung lesen (read-only) und einfügen
   ============================================================ */
let LIB = null;
try{ const c=JSON.parse(localStorage.getItem("tb_lib_cache")||"null"); if(c&&c.data) LIB=c; }catch(e){}
async function libLoad(force){
  if(!force && LIB && Date.now()-LIB.at < 6e5) return LIB.data;
  try{
    const f = await ghGetAt(CFG.libUser(), CFG.libRepo(), CFG.libBranch(), CFG.libFile());
    if(!f || (!f.content && !f.download_url)) throw new Error("Sammlung nicht gefunden");
    let txt;
    if(f.content) txt = b64dec(f.content);
    else txt = await fetch(f.download_url).then(r=>r.text());
    const parsed = JSON.parse(txt);
    const data = parsed.state || parsed;
    data.exercises ||= []; data.blueprints ||= [];
    LIB = {at:Date.now(), data};
    try{ localStorage.setItem("tb_lib_cache", JSON.stringify(LIB)); }catch(e){}
    return data;
  }catch(e){
    if(LIB && LIB.data) return LIB.data;   // Fallback: alter Cache
    throw e;
  }
}
async function refreshLib(){
  try{ const d=await libLoad(true); toast("Sammlung geladen: "+(d.exercises.length)+" Übungen, "+(d.blueprints.length)+" Bausteine"); }
  catch(e){ toast("Sammlung: "+(e.message||e)); }
}
const LIB_TYPES = {aufwaermen:"Aufwärmen", korb:"Korbübung", uebung:"Übung", spielform:"Spielform"};
const LIB_BALLS = {rot:"Rot", orange:"Orange", gruen:"Grün", gelb:"Gelb"};
function openLibPick(session){
  const hasTok = !!CFG.tok();
  if(!LIB && !hasTok){ toast("Erst Cloud-Sync mit Token einrichten – dann lädt die Sammlung"); return; }
  if(session.area==="kondition"){ toast("Die Übungssammlung ist reines Tennis"); return; }
  let view="exercises", typ="alle", ball="alle", q="";
  openSheet(`<h2>📚 Aus Sammlung einfügen</h2>
    <div class="sub" id="libSub">${LIB?("Stand: "+new Date(LIB.at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})):"lädt…"} · <a id="libRefresh" style="color:var(--accent)">aktualisieren</a></div>
    <div class="seg" style="margin-bottom:10px"><button id="lvEx" class="on">Einzelübungen</button><button id="lvBp">Stunden-Bausteine</button></div>
    <input id="libQ" placeholder="Suchen…" style="width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px">
    <div id="libTyp" class="tagbar" style="margin:0 0 6px"></div>
    <div id="libBall" class="tagbar" style="margin:0 0 8px"></div>
    <div id="libList"></div>
    <button class="sheet-close">Fertig</button>`);
  const seg=$("#lvEx",sheetPanel).parentElement;
  $("#lvEx",sheetPanel).onclick=()=>{ view="exercises"; seg.children[0].classList.add("on"); seg.children[1].classList.remove("on"); draw(); };
  $("#lvBp",sheetPanel).onclick=()=>{ view="blueprints"; seg.children[1].classList.add("on"); seg.children[0].classList.remove("on"); draw(); };
  $("#libQ",sheetPanel).oninput=e=>{ q=e.target.value.toLowerCase(); draw(); };
  $("#libRefresh",sheetPanel).onclick=async()=>{ $("#libSub",sheetPanel).textContent="lädt…"; await refreshLib(); draw(); };
  $(".sheet-close",sheetPanel).onclick=closeSheet;

  function addExercise(x){
    session.items.push({id:uid(), text: x.name + (x.desc?" – "+x.desc:""), done:false,
      group: LIB_TYPES[x.type] || (x.tags&&x.tags[0]) || "Aus Sammlung", min: x.durationMin||"",
      court: (x.court&&x.court.els&&x.court.els.length)?x.court:undefined});
    (x.tags||[]).forEach(t=>{ if(!(session.tags||[]).includes(t)) (session.tags=session.tags||[]).push(t); });
    touch(session); save(); render(); toast("„"+x.name+"“ eingefügt");
  }
  function appendBlueprint(b){
    (b.items||[]).forEach(i=> session.items.push({id:uid(), text:i.text, done:false, group:i.group||b.name, min:i.durationMin||""}));
    (b.tags||[]).forEach(t=>{ if(!(session.tags||[]).includes(t)) (session.tags=session.tags||[]).push(t); });
    if(!session.title) session.title = b.name;
    touch(session); save(); render(); toast("Baustein „"+b.name+"“ angehängt ("+(b.items||[]).length+" Punkte)");
  }
  function newFromBlueprint(b){
    closeSheet();
    newSession("tennis", null, session.groupId||undefined);
    const ns = state.sessions[state.sessions.length-1];
    ns.title=b.name; ns.tags=[...(b.tags||[])];
    (b.items||[]).forEach(i=> ns.items.push({id:uid(),text:i.text,done:false,group:i.group||"",min:i.durationMin||""}));
    touch(ns); save(); render(); toast("Neue Einheit aus „"+b.name+"“");
  }
  function chipRow(host, opts, cur, onPick){
    host.innerHTML="";
    opts.forEach(([v,l])=>{ const b=document.createElement("button"); b.className=(v===cur?"on":""); b.textContent=l; b.onclick=()=>onPick(v); host.appendChild(b); });
  }

  async function draw(){
    const host=$("#libList",sheetPanel); host.innerHTML='<div style="color:var(--faint);font-size:13px;padding:10px">lädt…</div>';
    let data;
    try{ data = await libLoad(false); }catch(e){ host.innerHTML='<div style="color:var(--faint);font-size:13px;padding:10px">Sammlung nicht erreichbar: '+esc(e.message||e)+'</div>'; return; }
    $("#libSub",sheetPanel).innerHTML = "Stand: "+new Date(LIB.at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+' · <a id="libRefresh" style="color:var(--accent)">aktualisieren</a>';
    $("#libRefresh",sheetPanel).onclick=async()=>{ await refreshLib(); draw(); };
    const arr = (view==="blueprints"?data.blueprints:data.exercises)||[];
    chipRow($("#libTyp",sheetPanel), [["alle","alle Typen"],...Object.entries(LIB_TYPES)], typ, v=>{ typ=v; draw(); });
    chipRow($("#libBall",sheetPanel), [["alle","alle Bälle"],...Object.entries(LIB_BALLS)], ball, v=>{ ball=v; draw(); });
    const items = arr.filter(x=>{
      if(typ!=="alle" && x.type!==typ) return false;
      if(ball!=="alle" && !(x.balls||[]).includes(ball)) return false;
      if(q){ const hay=[x.name,x.desc,x.note,(x.tags||[]).join(" "),(x.items||[]).map(i=>i.text).join(" ")].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    }).sort((a,b)=>a.name.localeCompare(b.name));
    host.innerHTML="";
    if(!items.length){ host.innerHTML='<div style="color:var(--faint);font-size:13px;padding:10px">Nichts gefunden – Filter lockern oder Sammlung aktualisieren.</div>'; return; }
    items.forEach(x=>{
      const facet = [LIB_TYPES[x.type], (x.balls||[]).map(b=>LIB_BALLS[b]).join("/"), (x.aud||[]).join("/")].filter(Boolean).join(" · ");
      const row=document.createElement("div"); row.className="pick";
      if(view==="blueprints"){
        row.innerHTML=`<div class="p-main"><div style="font-weight:600">${esc(x.name)}${x.durationMin?` · ${x.durationMin}′`:""}</div>
          <div class="p-tags">${(x.items||[]).length} Schritte · ${esc(facet)}</div></div>`;
        const b1=document.createElement("button"); b1.className="p-add"; b1.textContent="↳"; b1.title="Punkte anhängen"; b1.onclick=()=>appendBlueprint(x);
        const b2=document.createElement("button"); b2.className="p-add"; b2.style.color="var(--faint)"; b2.textContent="＋"; b2.title="als neue Einheit"; b2.onclick=()=>newFromBlueprint(x);
        row.append(b1,b2);
      }else{
        row.innerHTML=`<button class="p-add">＋</button><div class="p-main"><div style="font-weight:600">${esc(x.name)}${x.durationMin?` · ${x.durationMin}′`:""}${x.court&&x.court.els&&x.court.els.length?" 📐":""}</div>
          ${x.desc?`<div class="p-tags">${esc(x.desc)}</div>`:""}
          <div class="p-tags">${esc(facet)}${(x.tags||[]).length?" · "+x.tags.map(esc).join(", "):""}</div></div>`;
        $(".p-add",row).onclick=()=>addExercise(x);
      }
      host.appendChild(row);
    });
  }
  draw();
}

$("#composeInput").onkeydown=e=>{
  if(e.key!=="Enter") return;
  const txt=e.target.value.trim(); if(!txt) return;
  const a = state.settings.area==="alle" ? "tennis" : state.settings.area;
  const grp = activeGroup();
  let pool = state.sessions.filter(x=>x.area===a && x.status!=="done");
  if(grp!=="alle") pool = pool.filter(x=>x.groupId===grp);
  let s = pool.sort((x,y)=>(y.date||"").localeCompare(x.date||""))[0];
  if(!s){ newSession(a,false, grp!=="alle"?grp:undefined); s=state.sessions[state.sessions.length-1]; }
  s.items.push({id:uid(),text:txt,done:false,group:"Notizen"});
  touch(s); openIds.add(s.id); save(); render();
  e.target.value=""; toast("Zu „"+fmtDate(s.date)+"“ hinzugefügt");
};
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !sheet.classList.contains("hidden")) closeSheet(); });

render();
cloudInit();
